# ============================================================================
# Boemi Nusantara — nginx reverse proxy (command center / VPS)
# Dua sub-server di satu domain www.boeminusantara.com:
#   /      -> boemi (FE Next.js)      127.0.0.1:3000   (next start)
#   /api/  -> boemi-api (Fastify BE)  127.0.0.1:4700   (path /api dibuang)
#
# Catatan: FE (Next server) memanggil backend SERVER-SIDE langsung via
# BOEMI_API_URL=http://127.0.0.1:4700 (bukan lewat /api). Lokasi /api di sini
# untuk panggilan client-side (mis. admin) & konsumen API eksternal.
#
# Taruh di /etc/nginx/sites-available/boemi, symlink ke sites-enabled,
# lalu `certbot --nginx -d boeminusantara.com -d www.boeminusantara.com`.
# ============================================================================

# Apex -> www
server {
    listen 80;
    listen [::]:80;
    server_name boeminusantara.com;
    return 301 https://www.boeminusantara.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.boeminusantara.com;
    # certbot akan menambah blok 443 + redirect otomatis.

    client_max_body_size 15m;   # upload gambar produk (admin)

    # --- Backend API (sub-server boemi-api) ---
    location /api/ {
        proxy_pass http://127.0.0.1:4700/;   # trailing slash -> /api dibuang
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Aset statis Next (cache panjang) ---
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Gambar produk (dilayani FE dari /public/produk) ---
    location /produk/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=604800";
    }

    # --- Frontend (boemi Next.js) ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
